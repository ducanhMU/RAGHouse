version: '3.8'

services:
  # ===== DATABASES =====
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # V2 NEW: ClickHouse for Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rag_clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pass}
    volumes:
      - ./volumes/clickhouse:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ===== VECTOR DATABASE (MILVUS) =====
  etcd:
    container_name: rag_milvus_etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  minio:
    container_name: rag_milvus_minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  milvus:
    container_name: rag_milvus
    image: milvusdb/milvus:v2.6.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ===== LLM SERVICE =====
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag_network
    restart: unless-stopped
    # V2: Pull required models
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!
        echo "Waiting for Ollama to start..."
        sleep 10
        
        echo "Pulling EmbeddingGemma for embeddings..."
        ollama pull embeddinggemma
        
        echo "Pulling gpt-oss:20b for inference (quantized)..."
        ollama pull gpt-oss:20b
        
        echo "All models ready!"
        wait $$OLLAMA_PID

  # ===== API SERVICE =====
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rag_api_v2
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./api/data:/app/data
      - ./api/logs:/app/logs
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-rag_db}
      
      # ClickHouse (V2 NEW)
      - CLICKHOUSE_URL=clickhouse://default:${CLICKHOUSE_PASSWORD:-clickhouse_pass}@clickhouse:8123/analytics
      
      # Milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION_NAME=rag_collection_v2
      
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gpt-oss:20b
      
      # Google AI
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      
      # Superset (V2 NEW)
      - SUPERSET_BASE_URL=http://superset:8088
      
      # Application
      - DATA_PATH=/app/data
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for dependencies...' &&
        sleep 20 &&
        echo 'Starting RAG V2 API...' &&
        uvicorn app.main:app 
          --host 0.0.0.0 
          --port 8000 
          --reload 
          --reload-dir /app/app
          --log-level info
      "

  # ===== UI SERVICE =====
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag_ui_v2
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped
    command: >
      streamlit run app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.enableCORS false

  # ===== V2 NEW: SUPERSET (Visualization) =====
  superset:
    image: apache/superset:latest
    container_name: rag_superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-your_secret_key_here}
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_DATABASE_URL: postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/superset
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped
    command: >
      sh -c "
        superset db upgrade &&
        superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@superset.com \
          --password admin &&
        superset init &&
        gunicorn \
          --bind 0.0.0.0:8088 \
          --workers 4 \
          --timeout 120 \
          --limit-request-line 0 \
          --limit-request-field_size 0 \
          'superset.app:create_app()'
      "

  # ===== MANAGEMENT UIS =====
  attu:
    container_name: rag_milvus_attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ===== MONITORING =====
  jaeger:
    container_name: rag_jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - rag_network
    restart: unless-stopped

networks:
  rag_network:
    name: rag_network_v2
    driver: bridge

volumes:
  ollama_data:
    name: rag_ollama_data_v2
  superset_home:
    name: rag_superset_home