version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # etcd (Milvus Metadata Store)
  # ============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - ${DATA_ROOT}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # MinIO (Milvus Object Storage)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${DATA_ROOT}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"  # MinIO Console
      - "9003:9000"  # MinIO API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Milvus Standalone
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: rag_milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ${DATA_ROOT}/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Attu (Milvus Web UI)
  # ============================================
  attu:
    image: zilliz/attu:v2.4
    container_name: rag_attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Ollama (Local LLM Server)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "\
      ollama serve & \
      sleep 5 && \
      ollama pull llama3:8b && \
      wait"]

  # ============================================
  # StarRocks Frontend (FE) - Quản lý Metadata & Client
  # ============================================
  starrocks-fe:
    image: starrocks/fe-ubuntu:latest
    container_name: rag_starrocks_fe
    hostname: starrocks-fe
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Lưu Metadata của FE
      - ${DATA_ROOT}/starrocks_fe:/opt/starrocks/fe/meta
    ports:
      - "8030:8030"  # FE Web UI
      - "9020:9020"  # RPC Port
      - "9030:9030"  # MySQL Protocol Port (API kết nối vào đây)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # StarRocks Backend (BE) - Lưu trữ & Tính toán
  # ============================================
  starrocks-be:
    image: starrocks/be-ubuntu:latest
    container_name: rag_starrocks_be
    hostname: starrocks-be
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Lưu trữ dữ liệu thực (Data Storage)
      - ${DATA_ROOT}/starrocks_be:/opt/starrocks/be/storage
    ports:
      - "8040:8040"  # BE Web UI
      - "9060:9060"  # BE RPC
      - "9050:9050"  # BE Heartbeat
    depends_on:
      - starrocks-fe
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # StarRocks Init Job (Kết nối BE với FE & Init DB)
  # ============================================
  starrocks-init:
    image: mysql:8.0-debian
    container_name: rag_starrocks_init
    volumes:
      - ./starrocks/init.sql:/init.sql
    networks:
      - rag_network
    depends_on:
      starrocks-fe:
        condition: service_healthy
      starrocks-be:
        condition: service_started
    entrypoint: [ "bash", "-c" ]
    command: 
      - |
        echo "Waiting for StarRocks FE..."
        until mysql -h starrocks-fe -P 9030 -u root --connect-timeout=2 -e 'SELECT 1'; do
          echo "FE unavailable - sleeping"
          sleep 3
        done
        
        echo "FE is up. Registering Backend (BE)..."
        # Lệnh quan trọng: Đăng ký BE vào cluster (9050 là heartbeat port)
        # Dùng "|| true" để không báo lỗi nếu đã đăng ký rồi
        mysql -h starrocks-fe -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND 'starrocks-be:9050'" || true
        
        echo "Executing init.sql..."
        mysql -h starrocks-fe -P 9030 -u root < /init.sql
        
        echo "Initialization completed."

  # ============================================
  # FastAPI Backend (RAG Engine)
  # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rag_api
    environment:
      # Database
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_db
      
      # Milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: rag_hybrid_collection
      
      # Models
      DEVICE: cuda
      HF_HOME: /app/.cache/huggingface
      
      # LLM
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      
      # Logging
      LOG_LEVEL: INFO

      # StarRocks (Async connection for Pydantic AI)
      STARROCKS_HOST: starrocks-fe
      STARROCKS_PORT: 9030
      STARROCKS_USER: rag_user
      STARROCKS_PASSWORD: rag_password
      STARROCKS_URI: mysql+aiomysql://rag_user:rag_password@starrocks-fe:9030/analytics
    volumes:
      - ./api/app:/app/app
      - ./api/data:/app/data
      - ${DATA_ROOT}/uploads:/app/data/uploads
      - ${DATA_ROOT}/hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_started
      starrocks:
        condition: service_healthy
      # IMPORTANT: Wait for init job to finish
      starrocks-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================
  # Streamlit UI
  # ============================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag_ui
    environment:
      API_URL: http://api:8000
    volumes:
      - ./ui/app.py:/app/app.py
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - rag_network
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

# ============================================
# Networks
# ============================================
networks:
  rag_network:
    driver: bridge
    name: rag_network

# ============================================
# Volumes (CẤU HÌNH THÔNG MINH: REUSE OR CREATE)
# ============================================
volumes:
  # 1. PostgreSQL (Đã có -> Docker sẽ tự tìm thấy 'rag_postgres_data' và dùng lại)
  postgres_data:
    name: rag_postgres_data
    driver: local

  # 2. Etcd (Đã có -> Dùng lại)
  etcd_data:
    name: rag_etcd_data
    driver: local

  # 3. MinIO (Đã có -> Dùng lại)
  minio_data:
    name: rag_minio_data
    driver: local

  # 4. Milvus (Đã có -> Dùng lại)
  milvus_data:
    name: rag_milvus_data
    driver: local

  # 5. Ollama (Đã có -> Dùng lại)
  ollama_data:
    name: rag_ollama_data
    driver: local

  # 6. API Uploads (Đã có -> Dùng lại)
  api_uploads:
    name: rag_api_uploads
    driver: local

  # 7. HF Cache (Đã có -> Dùng lại)
  hf_cache:
    name: rag_hf_cache
    driver: local

  # 8. StarRocks Meta (CHƯA CÓ -> Docker sẽ tự tạo mới với tên này)
  starrocks_fe_meta:
    name: rag_starrocks_fe_meta
    driver: local
  
  # 9. StarRocks Storage (CHƯA CÓ -> Docker sẽ tự tạo mới với tên này)
  starrocks_be_storage:
    name: rag_starrocks_be_storage
    driver: local