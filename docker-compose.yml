version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # etcd (Milvus Metadata Store)
  # ============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # MinIO (Milvus Object Storage)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"  # MinIO Console
      - "9003:9000"  # MinIO API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Milvus Standalone
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: rag_milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Attu (Milvus Web UI)
  # ============================================
  attu:
    image: zilliz/attu:v2.4
    container_name: rag_attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Ollama (Local LLM Server)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "\
      ollama serve & \
      until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 1; done && \
      ollama list | grep -q 'llama3.2:3b' || ollama pull llama3.2:3b && \
      wait"]

  # ============================================
  # FastAPI Backend (RAG Engine)
  # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rag_api
    environment:
      # Database
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_db
      
      # Milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: rag_hybrid_collection
      
      # Models
      DEVICE: cuda
      HF_HOME: /app/.cache/huggingface
      
      # LLM
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      
      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./api/app:/app/app
      - ./api/data:/app/data
      - api_uploads:/app/data/uploads
      - hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================
  # Streamlit UI
  # ============================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag_ui
    environment:
      API_URL: http://api:8000
    volumes:
      - ./ui/app.py:/app/app.py
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - rag_network
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

# ============================================
# Networks
# ============================================
networks:
  rag_network:
    driver: bridge
    name: rag_network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
    name: rag_postgres_data
  
  etcd_data:
    driver: local
    name: rag_etcd_data
  
  minio_data:
    driver: local
    name: rag_minio_data
  
  milvus_data:
    driver: local
    name: rag_milvus_data
  
  ollama_data:
    driver: local
    name: rag_ollama_data
  
  api_uploads:
    driver: local
    name: rag_api_uploads
  
  hf_cache:
    driver: local
    name: rag_hf_cache