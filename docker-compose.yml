version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # etcd (Milvus Metadata Store)
  # ============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - ${DATA_ROOT}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # MinIO (Milvus Object Storage)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${DATA_ROOT}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9003:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Milvus Standalone
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: rag_milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ${DATA_ROOT}/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Attu (Milvus Web UI)
  # ============================================
  attu:
    image: zilliz/attu:v2.4
    container_name: rag_attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Ollama (Local LLM Server)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "\
      ollama serve & \
      sleep 5 && \
      ollama pull llama3:8b && \
      wait"]

  # ============================================
  # StarRocks Frontend (FE)
  # ============================================
  starrocks-fe:
    image: starrocks/fe-ubuntu:latest
    container_name: rag_starrocks_fe
    hostname: starrocks-fe
    user: root
    # SỬA LỖI: Chạy thẳng script start, dùng FQDN để nhận diện hostname
    command: /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ${DATA_ROOT}/starrocks_fe:/opt/starrocks/fe/meta
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    healthcheck:
      # Healthcheck chuẩn từ snippet của bạn
      test: ["CMD-SHELL", "mysql -u root -h 127.0.0.1 -P 9030 -e 'SHOW FRONTENDS\\G' | grep 'Alive: true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # StarRocks Backend (BE)
  # ============================================
  starrocks-be:
    image: starrocks/be-ubuntu:latest
    container_name: rag_starrocks_be
    hostname: starrocks-be
    user: root
    # SỬA LỖI: Chạy thẳng script start BE
    command: /opt/starrocks/be/bin/start_be.sh
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ${DATA_ROOT}/starrocks_be:/opt/starrocks/be/storage
    ports:
      - "8040:8040"
      - "9060:9060"
      - "9050:9050"
    depends_on:
      starrocks-fe:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # StarRocks Init Job (Giữ nguyên để init DB)
  # ============================================
  starrocks-init:
    image: mysql:latest
    container_name: rag_starrocks_init
    volumes:
      - ./starrocks/init.sql:/init.sql
    networks:
      - rag_network
    depends_on:
      starrocks-fe:
        condition: service_healthy
      starrocks-be:
        condition: service_started
    entrypoint: [ "bash", "-c" ]
    command: 
      - |
        echo "Waiting for StarRocks FE..."
        until mysql -h starrocks-fe -P 9030 -u root --connect-timeout=2 -e 'SELECT 1'; do
          echo "FE unavailable - sleeping"
          sleep 3
        done
        
        echo "FE is up. Registering Backend (BE)..."
        # Đăng ký BE vào cluster (QUAN TRỌNG)
        mysql -h starrocks-fe -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND 'starrocks-be:9050'" || true
        
        echo "Executing init.sql..."
        mysql -h starrocks-fe -P 9030 -u root < /init.sql
        
        echo "Initialization completed."

  # ============================================
  # FastAPI Backend
  # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rag_api
    environment:
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_db
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: rag_hybrid_collection
      DEVICE: cuda
      HF_HOME: /app/.cache/huggingface
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      LOG_LEVEL: INFO
      STARROCKS_HOST: starrocks-fe
      STARROCKS_PORT: 9030
      STARROCKS_USER: rag_user
      STARROCKS_PASSWORD: rag_password
      STARROCKS_URI: mysql+aiomysql://rag_user:rag_password@starrocks-fe:9030/analytics
    volumes:
      - ./api/app:/app/app
      - ./api/data:/app/data
      - ${DATA_ROOT}/uploads:/app/data/uploads
      - ${DATA_ROOT}/hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_started
      starrocks-fe:
        condition: service_healthy
      starrocks-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Streamlit UI
  # ============================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag_ui
    environment:
      API_URL: http://api:8000
    volumes:
      - ./ui/app.py:/app/app.py
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - rag_network
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

# ============================================
# Networks
# ============================================
networks:
  rag_network:
    driver: bridge
    name: rag_network
